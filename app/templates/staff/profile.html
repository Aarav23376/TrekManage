{% extends "dashboard/staff_base.html" %}
{% block title %}My Profile{% endblock %}
{% block page_title %}Profile{% endblock %}



{% block content %}
<div class="panel" style="max-width:560px;">
  <div class="panel-title mb-3">Edit Profile</div>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" name="name" class="form-control" value="{{ current_user.full_name }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
    </div>
    <div class="mb-3">
      <label class="form-label">Contact Number</label>
      <input type="text" name="contact" class="form-control" value="{{ current_user.phone_number or '' }}">
    </div>
    <button type="submit" class="btn btn-primary px-4">Save Changes</button>
  </form>
</div>
{% endblock %}
